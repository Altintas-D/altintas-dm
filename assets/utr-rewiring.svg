<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 210" role="img" aria-labelledby="title desc"><title id="title">MET 5′UTR rewiring</title><desc id="desc">The wild-type MET 5′UTR has the same two uORFs and geometry as in the stress-response diagram. The partner-derived 5′UTR is shorter. Both rows preserve the same MET coding sequence. Schematic, not to scale.</desc><rect width="420" height="210" fill="#e9ede3"/><g font-family="Arial,sans-serif" fill="#183d34"><text x="22" y="32" font-size="11" letter-spacing="2">SAME CODING SEQUENCE. NEW CONTROL.</text><text x="35" y="56" font-size="11">WT MET 5′UTR / uORFs</text><g transform="translate(0 82)"><g data-part="wt-met"><path d="M35 0H385" stroke="#183d34" stroke-width="3"/><rect x="65" y="-10" width="35" height="20" fill="#b96c4b"/><rect x="124" y="-10" width="35" height="20" fill="#b96c4b"/><rect x="224" y="-18" width="138" height="36" fill="#183d34"/><text x="293" y="5" text-anchor="middle" font-size="13" fill="#f7f5ee">MET</text></g></g><g data-part="rewired-met" transform="translate(0 137)"><path d="M154 0H224" stroke="#b96c4b" stroke-width="6"/><path d="M362 0H385" stroke="#183d34" stroke-width="3"/><rect x="224" y="-18" width="138" height="36" fill="#183d34"/><text x="293" y="5" text-anchor="middle" font-size="13" fill="#f7f5ee">MET</text></g><text x="109" y="174" font-size="11">Shorter, partner-derived 5′UTR</text><text x="22" y="196" font-size="10" fill="#64716a">Conceptual schematic · Cell Reports, 2026</text></g></svg>