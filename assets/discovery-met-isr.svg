<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Stress-responsive MET translation</title><desc id="desc">Conceptual summary: environmental stress activates the integrated stress response. Two upstream open reading frames in the MET 5′UTR enable stress-responsive translation, increasing MET protein output and supporting MET-dependent invasive growth. Not experimental data.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#427c6e" stroke-width="1.4"/></marker></defs><rect width="640" height="360" rx="8" fill="#edf2ed"/><g font-family="Arial,sans-serif" fill="#182f3b">
<text x="28" y="32" font-size="12" letter-spacing="2" fill="#427c6e">01 / STRESS-RESPONSIVE TRANSLATION</text>
<rect x="28" y="55" width="174" height="48" rx="24" fill="#dae6dd"/><text x="115" y="84" text-anchor="middle" font-size="16">Environmental stress</text><path d="M208 79H257" stroke="#427c6e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="271" y="55" width="115" height="48" rx="24" fill="#182f3b"/><text x="328" y="84" text-anchor="middle" fill="white" font-size="16">ISR</text><path d="M392 79H444V143" fill="none" stroke="#427c6e" stroke-width="2" marker-end="url(#arrow)"/>
<text x="28" y="139" font-size="12" fill="#53636c">MET mRNA · 5′UTR</text><path d="M30 176H605" stroke="#182f3b" stroke-width="3"/><rect x="69" y="164" width="57" height="24" fill="#b67655"/><rect x="154" y="164" width="57" height="24" fill="#b67655"/><text x="98" y="211" text-anchor="middle" font-size="12">uORF1</text><text x="182" y="211" text-anchor="middle" font-size="12">uORF2</text><rect x="308" y="154" width="250" height="44" rx="3" fill="#182f3b"/><text x="433" y="182" text-anchor="middle" fill="white" font-size="17">MET coding sequence</text>
<path d="M434 222V246" stroke="#427c6e" stroke-width="2" marker-end="url(#arrow)"/><text x="433" y="272" text-anchor="middle" font-size="19" fill="#287366">Increased MET protein</text><text x="320" y="310" text-anchor="middle" font-size="14">Supporting MET-dependent invasive growth</text><text x="28" y="342" font-size="10" fill="#53636c">Conceptual summary · The EMBO Journal, 2025 · not to scale</text></g></svg>