<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Oncogene priming through 5′UTR rewiring</title><desc id="desc">Conceptual comparison: wild-type MET mRNA contains regulatory uORFs in the 5′UTR. A partner-derived 5′UTR changes regulatory architecture while retaining the MET coding sequence, increasing protein output. Not experimental data.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#427c6e" stroke-width="1.4"/></marker></defs><rect width="640" height="360" rx="8" fill="#edf2ed"/><g font-family="Arial,sans-serif" fill="#182f3b">
<text x="28" y="32" font-size="12" letter-spacing="2" fill="#427c6e">02 / ONCOGENE PRIMING</text><text x="28" y="70" font-size="13">Native regulatory architecture</text>
<path d="M30 112H605" stroke="#182f3b" stroke-width="3"/><rect x="69" y="100" width="57" height="24" fill="#b67655"/><rect x="154" y="100" width="57" height="24" fill="#b67655"/><rect x="308" y="90" width="250" height="44" rx="3" fill="#182f3b"/><text x="433" y="118" text-anchor="middle" fill="white" font-size="17">MET coding sequence</text><text x="140" y="150" text-anchor="middle" font-size="12" fill="#53636c">MET 5′UTR / uORFs</text>
